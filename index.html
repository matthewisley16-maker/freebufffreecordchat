<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#8b5cf6" />
  <meta name="description" content="Freecord is your little corner of the internet. Create a community, share ideas, and keep the conversation going." />
  <title>Modern Discord Clone</title>
</head>


<body>
  <div id="root"></div>
  <!--
    Blank-page fallback. An older browser that cannot parse the bundle, or a
    failed download, leaves #root empty with no explanation; this shows a plain
    message instead of nothing. Written in ES5 on purpose so it runs anywhere.
  -->
  <div id="boot-fallback" style="display:none;font-family:system-ui,sans-serif;color:#e5e7eb;background:#0b0b10;min-height:100vh;padding:32px;text-align:center">
    <p style="font-size:18px;font-weight:600;margin:0 0 8px">Freecord is taking longer than usual to load.</p>
    <p style="font-size:14px;margin:0 0 16px;color:#9ca3af">Please check your connection and reload. If it keeps happening, update your browser (Safari 13+, Chrome 80+ or Firefox 72+).</p>
    <p style="font-size:13px;color:#6b7280" id="boot-fallback-detail"></p>
  </div>
  <script>
    (function () {
      window.setTimeout(function () {
        var root = document.getElementById("root");
        var fallback = document.getElementById("boot-fallback");
        if (root && fallback && root.childNodes.length === 0) {
          fallback.style.display = "block";
          var detail = document.getElementById("boot-fallback-detail");
          if (detail) detail.textContent = navigator.userAgent;
        }
      }, 15000);
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
